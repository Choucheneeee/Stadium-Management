version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql  # Name it exactly as your app expects!
    hostname: mysql        # This ensures the hostname is 'mysql'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: terrain
      MYSQL_ROOT_HOST: '%'
    ports:
      - "8900:3306"
    volumes:
      - ./terrain.sql:/docker-entrypoint-initdb.d/terrain.sql
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
      
  mywebapp:
    build: .
    container_name: gestion_terrain
    ports:
      - "8901:8080"
    depends_on:
      - mysql
    links:
      - mysql  # This creates the network alias
    restart: unless-stopped
    
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    ports:
      - "8902:80"
    restart: unless-stopped
